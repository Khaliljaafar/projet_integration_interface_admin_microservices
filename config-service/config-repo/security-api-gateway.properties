server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.main.web-application-type=reactive
spring.cloud.compatibility-verifier.enabled=false

# Explicit route for user-access-service to ensure stable path mapping
spring.cloud.gateway.routes[0].id=user-access-service
spring.cloud.gateway.routes[0].uri=lb://user-access-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-access-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
